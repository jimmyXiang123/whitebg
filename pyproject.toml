[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whitebg"
dynamic = ["version"]
description = "批量把产品实拍图转成白底电商主图（rembg 抠图 + 构图/白底/投影后处理）"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "whitebg contributors" }]
keywords = ["rembg", "background-removal", "white-background", "e-commerce", "image-processing", "tkinter"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]
dependencies = [
    "numpy>=1.24",
    "Pillow>=10.0",
    "PyMatting>=1.1.12",
    "rembg>=2.0.60,<3",
    "onnxruntime>=1.17",
    "tkinterdnd2>=0.3.0",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.0"]
dev = ["ruff>=0.5"]

[project.scripts]
whitebg = "whitebg.engine:launch"
whitebg-gui = "whitebg.gui:launch"

[project.urls]
Documentation = "https://github.com/jimmyXiang123/whitebg#readme"
Repository = "https://github.com/jimmyXiang123/whitebg"
Issues = "https://github.com/jimmyXiang123/whitebg/issues"

[tool.setuptools]
packages = ["whitebg"]

[tool.setuptools.dynamic]
version = { attr = "whitebg.__version__" }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
